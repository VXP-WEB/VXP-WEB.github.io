<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vxp — Reseñas y Crónicas</title>

    <!-- 1. ICONO DE LA PESTAÑA -->
    <link rel="icon" type="image/x-icon" href="vxp.ico">

    <!-- 2. MEDIDOR DE VISITAS (GoatCounter) -->
    <script data-goatcounter="https://vxp-web.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

    <!-- 3. ESTILOS CSS -->
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --muted-color: #a0a0a0;
            --border-color: #2d2d2d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Garamond', Georgia, serif;
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* Logo centrado sin fondo ni recuadros extra */
        .site-logo {
            max-width: 170px;
            height: auto;
            display: block;
            margin: 0 auto 5px auto;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .subtitle {
            color: var(--muted-color);
            font-style: italic;
            margin-top: 10px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.95rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .post-preview {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .post-title {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
        }

        .post-title a {
            color: #ffffff;
            text-decoration: none;
        }

        .post-title a:hover {
            color: var(--accent-color);
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--muted-color);
            margin-bottom: 10px;
        }

        footer {
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            font-size: 0.85rem;
            color: var(--muted-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo principal -->
        <img src="vxp.png" alt="vxp logo" class="site-logo">

        <p class="subtitle">Bitácora de reseñas, mis historias de ficcion y otros rastros.</p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Reseñas</a>
            <a href="#">Sobre el proyecto</a>
        </nav>
    </header>

    <main>
        <article class="post-preview">
            <h2 class="post-title"><a href="#">Bienvenido a VXP</a></h2>
            <div class="post-date">21 de Septiembre, 2026</div>
            <p>Espacio dedicado a reviews cinematográficas, literatura propia y notas sobre proyectos en desarrollo.</p>
        </article>
    </main>

    <footer>
        &copy; 2026 VXP. Todos los derechos reservados.
    </footer>

</body>
</html>
